name: Build
on: [push, workflow_dispatch]
jobs:
  win:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
        with:
          target: Win64
          sdk: latest
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Mod
          path: ${{ steps.build.outputs.build-output }}
